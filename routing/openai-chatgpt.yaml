# Compatibility routing matrix for existing openai-chatgpt selections.
# New setups should use the canonical routing-matrix bundle's `openai` matrix,
# which handles both backends and caller-consistent delegation.
# This legacy explicit-name matrix remains for compatibility; its interim
# October 2026 refresh selects only clean GPT-6+ IDs, not -fast variants.
# Pins are accepted by the resolver without entitlement validation. The live
# catalog remains account-specific; a second exact pin would not provide
# model-not-found fallback. No native image-generation claim is made here.
name: openai-chatgpt
description: "Compatibility ChatGPT-only matrix: interim Sol 6.1 / Luna 6 selections. Prefer canonical openai routing for new setups."
updated: "2026-10-02"
roles:
  general:
    description: "Versatile catch-all"
    candidates:
      - provider: openai-chatgpt
        model: gpt-6.1-sol
  fast:
    description: "Quick utility tasks"
    candidates:
      - provider: openai-chatgpt
        model: gpt-6-luna
  coding:
    description: "Code generation and debugging"
    candidates:
      - provider: openai-chatgpt
        model: gpt-6.1-sol
  ui-coding:
    description: "Frontend and UI code"
    candidates:
      - provider: openai-chatgpt
        model: gpt-6-luna
        config:
          reasoning_effort: max
  security-audit:
    description: "Security analysis"
    candidates:
